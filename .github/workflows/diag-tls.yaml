# Temporary diagnostic workflow; remove before merging.
on:
  push:
    branches: [ci-stabilize]
name: diag-tls
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::terra
      - run: Rscript .github/diag/tls.R
