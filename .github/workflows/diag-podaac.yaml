# Temporary diagnostic workflow; remove before merging.
on:
  push:
    branches: [ci-stabilize]
name: diag-podaac
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::terra, any::testthat
      - run: Rscript .github/diag/podaac.R netrc_only
      - run: Rscript .github/diag/podaac.R download_then_netrc
      - run: Rscript .github/diag/podaac.R netrc_only
      - run: Rscript .github/diag/podaac.R download_then_netrc
